name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NorwinMouseAssist --icon icon.ico main.py
      - uses: actions/upload-artifact@v4
        with:
          name: NorwinMouseAssist-windows
          path: dist/NorwinMouseAssist.exe
